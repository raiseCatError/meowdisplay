<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <title>MeowDisplay — Overview panel, connected state</title>
  <desc>Reconstructed product visual using the exact field labels and states from Mac/OverviewSettingsView.swift's Overview panel (LabeledContent rows: Video, Audio, Input, Resolution, Video Bitrate, Connection, Status; ConnectionRoute values USB/AWDL/LAN/Remote from Shared/ConnectionRoute.swift).</desc>
  <rect width="640" height="560" fill="#F5F5F7"/>

  <!-- window chrome -->
  <rect x="20" y="20" width="600" height="520" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
  <rect x="20" y="20" width="600" height="36" rx="12" fill="#F5F5F7"/>
  <circle cx="42" cy="38" r="6" fill="#FF5F57"/>
  <circle cx="60" cy="38" r="6" fill="#FEBC2E"/>
  <circle cx="78" cy="38" r="6" fill="#28C840"/>
  <text x="320" y="43" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#1D1D1F" text-anchor="middle" font-weight="600">MeowDisplay — Overview</text>

  <!-- section: iPad (connected) -->
  <g font-family="-apple-system,Helvetica,Arial,sans-serif">
    <rect x="40" y="76" width="560" height="330" rx="10" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="56" y="100" font-size="13" fill="#6E6E73" font-weight="600">IPAD</text>

    <text x="56" y="128" font-size="13" fill="#6E6E73">Mirroring · LAN</text>

    <!-- LabeledContent rows -->
    <g font-size="14">
      <text x="56" y="162" fill="#1D1D1F">Video</text>
      <text x="584" y="162" fill="#6E6E73" text-anchor="end">Streaming</text>
      <line x1="56" y1="172" x2="584" y2="172" stroke="#E5E5EA"/>

      <text x="56" y="198" fill="#1D1D1F">Audio</text>
      <text x="584" y="198" fill="#6E6E73" text-anchor="end">Streaming</text>
      <line x1="56" y1="208" x2="584" y2="208" stroke="#E5E5EA"/>

      <text x="56" y="234" fill="#1D1D1F">Input</text>
      <text x="584" y="234" fill="#6E6E73" text-anchor="end">Enabled</text>
      <line x1="56" y1="244" x2="584" y2="244" stroke="#E5E5EA"/>

      <text x="56" y="270" fill="#1D1D1F">Resolution</text>
      <text x="584" y="270" fill="#6E6E73" text-anchor="end">2732 × 2048</text>
      <line x1="56" y1="280" x2="584" y2="280" stroke="#E5E5EA"/>

      <text x="56" y="306" fill="#1D1D1F">Video Bitrate</text>
      <text x="584" y="306" fill="#6E6E73" text-anchor="end">20 Mbps</text>
      <line x1="56" y1="316" x2="584" y2="316" stroke="#E5E5EA"/>

      <text x="56" y="342" fill="#1D1D1F">Connection</text>
      <text x="584" y="342" fill="#6E6E73" text-anchor="end">LAN</text>
      <line x1="56" y1="352" x2="584" y2="352" stroke="#E5E5EA"/>

      <text x="56" y="378" fill="#1D1D1F">Status</text>
      <text x="584" y="378" fill="#30D158" text-anchor="end" font-weight="600">Authenticated</text>
    </g>
  </g>

  <!-- buttons: Pause / Reconnect / Disconnect / Open Displays… -->
  <g font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13">
    <rect x="56" y="418" width="70" height="28" rx="6" fill="#E5E5EA"/>
    <text x="91" y="436" fill="#1D1D1F" text-anchor="middle">Pause</text>

    <rect x="134" y="418" width="90" height="28" rx="6" fill="#E5E5EA"/>
    <text x="179" y="436" fill="#1D1D1F" text-anchor="middle">Reconnect</text>

    <rect x="232" y="418" width="94" height="28" rx="6" fill="#E5E5EA"/>
    <text x="279" y="436" fill="#1D1D1F" text-anchor="middle">Disconnect</text>

    <rect x="334" y="418" width="128" height="28" rx="6" fill="#E5E5EA"/>
    <text x="398" y="436" fill="#1D1D1F" text-anchor="middle">Open Displays…</text>
  </g>

  <!-- section: Known Devices (disconnected suggestion, shown for context) -->
  <g font-family="-apple-system,Helvetica,Arial,sans-serif">
    <text x="56" y="472" font-size="13" fill="#6E6E73" font-weight="600">KNOWN DEVICES</text>
    <rect x="40" y="482" width="560" height="46" rx="10" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="56" y="510" font-size="14" fill="#1D1D1F">Example's iPhone</text>
    <rect x="512" y="493" width="70" height="24" rx="6" fill="#0A84FF"/>
    <text x="547" y="510" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">Connect</text>
  </g>
</svg>
