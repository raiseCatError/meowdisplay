<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>MeowDisplay — Mac connected to an iPad, extended display</title>
  <desc>Reconstructed product visual, not a literal screenshot. Reflects current MeowDisplay UI conventions (system blue accent, native macOS/iOS chrome).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F5F7"/>
      <stop offset="1" stop-color="#E8E8ED"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- MacBook -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="560" height="340" rx="14" fill="#1D1D1F"/>
    <rect x="12" y="12" width="536" height="316" rx="4" fill="#0B0B0C"/>
    <!-- desktop content: menu bar + a window -->
    <rect x="12" y="12" width="536" height="20" fill="#2C2C2E"/>
    <circle cx="26" cy="22" r="4" fill="#8E8E93"/>
    <text x="470" y="27" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#AEAEB2" text-anchor="end">Mon 9:41</text>
    <rect x="60" y="60" width="360" height="220" rx="8" fill="#F5F5F7"/>
    <rect x="60" y="60" width="360" height="26" rx="8" fill="#E5E5EA"/>
    <circle cx="76" cy="73" r="5" fill="#FF5F57"/>
    <circle cx="92" cy="73" r="5" fill="#FEBC2E"/>
    <circle cx="108" cy="73" r="5" fill="#28C840"/>
    <rect x="80" y="106" width="300" height="10" rx="3" fill="#D1D1D6"/>
    <rect x="80" y="128" width="240" height="10" rx="3" fill="#D1D1D6"/>
    <rect x="80" y="150" width="270" height="10" rx="3" fill="#D1D1D6"/>
    <!-- base/hinge -->
    <rect x="-30" y="340" width="620" height="14" rx="6" fill="#2C2C2E"/>
  </g>

  <!-- connection arc -->
  <path d="M 660 300 C 760 260, 820 260, 900 300" stroke="#0A84FF" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g transform="translate(755,235)">
    <circle r="20" fill="#0A84FF"/>
    <path d="M -8 2 A 8 8 0 0 1 8 2 M -5 -2 A 4.5 4.5 0 0 1 5 -2" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- iPad, extended display continuing the Mac window -->
  <g transform="translate(900,120)">
    <rect x="0" y="0" width="230" height="330" rx="24" fill="#1D1D1F"/>
    <rect x="10" y="10" width="210" height="310" rx="14" fill="#F5F5F7"/>
    <!-- top status -->
    <text x="20" y="30" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10" fill="#8E8E93">9:41</text>
    <!-- continuation of the same window, "extended" onto the iPad -->
    <rect x="10" y="46" width="210" height="180" fill="#F5F5F7"/>
    <rect x="20" y="66" width="190" height="10" rx="3" fill="#D1D1D6"/>
    <rect x="20" y="88" width="150" height="10" rx="3" fill="#D1D1D6"/>
    <rect x="20" y="110" width="170" height="10" rx="3" fill="#D1D1D6"/>
    <!-- Extend badge -->
    <rect x="20" y="250" width="80" height="26" rx="13" fill="#0A84FF"/>
    <text x="60" y="267" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">Extend</text>
  </g>

  <!-- wordmark -->
  <text x="90" y="560" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#1D1D1F">MeowDisplay</text>
  <text x="90" y="592" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#6E6E73">Turn your iPhone or iPad into a secure display for your Mac.</text>
</svg>
