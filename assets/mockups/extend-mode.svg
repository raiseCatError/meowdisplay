<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <title>MeowDisplay — Extend mode</title>
  <desc>Reconstructed product visual: the iPad becomes a genuine additional display (CGVirtualDisplay), distinct from the Mac's own screen, per the app's Displays &gt; Display Mode &gt; Extend setting.</desc>
  <rect width="900" height="520" fill="#F5F5F7"/>

  <!-- Mac display with its own window -->
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="420" height="270" rx="10" fill="#1D1D1F"/>
    <rect x="10" y="10" width="400" height="250" fill="#EDEDF2"/>
    <rect x="10" y="10" width="400" height="18" fill="#2C2C2E"/>
    <circle cx="24" cy="19" r="3.5" fill="#8E8E93"/>
    <rect x="40" y="52" width="330" height="180" rx="6" fill="#FFFFFF"/>
    <rect x="40" y="52" width="330" height="22" rx="6" fill="#E5E5EA"/>
    <circle cx="55" cy="63" r="4" fill="#FF5F57"/>
    <circle cx="69" cy="63" r="4" fill="#FEBC2E"/>
    <circle cx="83" cy="63" r="4" fill="#28C840"/>
    <rect x="56" y="92" width="270" height="9" rx="3" fill="#D1D1D6"/>
    <rect x="56" y="112" width="200" height="9" rx="3" fill="#D1D1D6"/>
    <rect x="-30" y="270" width="480" height="12" rx="5" fill="#2C2C2E"/>
    <text x="210" y="330" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#6E6E73" text-anchor="middle">Mac's own display</text>
  </g>

  <!-- plus sign -->
  <g transform="translate(525,205)">
    <path d="M0 -14 V14 M-14 0 H14" stroke="#8E8E93" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- iPad as a SEPARATE, additional display -->
  <g transform="translate(600,60)">
    <rect x="0" y="0" width="230" height="330" rx="24" fill="#1D1D1F"/>
    <rect x="10" y="10" width="210" height="310" rx="14" fill="#EDEDF2"/>
    <!-- a different window, unique to this display -->
    <rect x="20" y="40" width="190" height="140" rx="6" fill="#FFFFFF"/>
    <rect x="20" y="40" width="190" height="20" rx="6" fill="#E5E5EA"/>
    <circle cx="32" cy="50" r="3.5" fill="#FF5F57"/>
    <circle cx="44" cy="50" r="3.5" fill="#FEBC2E"/>
    <circle cx="56" cy="50" r="3.5" fill="#28C840"/>
    <rect x="34" y="74" width="150" height="8" rx="3" fill="#D1D1D6"/>
    <rect x="34" y="92" width="90" height="8" rx="3" fill="#D1D1D6"/>
    <rect x="20" y="270" width="80" height="26" rx="13" fill="#0A84FF"/>
    <text x="60" y="287" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">Extend</text>
    <text x="115" y="405" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#6E6E73" text-anchor="middle">iPad (extended display)</text>
  </g>
</svg>
