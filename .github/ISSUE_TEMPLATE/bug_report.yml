name: Bug report
description: Report a reproducible problem with the Mac, iPhone/iPad, Android or Mac Receiver app.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search for an existing issue first. For **security or privacy vulnerabilities**, use the repository's private **Security → Report a vulnerability** flow, not this public form.

        **Privacy:** Do not include real pairing codes, device IDs, IP addresses, Tailscale names, secrets, personal files, notifications or identifiable screenshots. Sanitize all logs and recordings before attaching them.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: This is not a security or privacy vulnerability.
          required: true
        - label: I have removed private details from anything I am sharing.
          required: true
  - type: dropdown
    id: affected-app
    attributes:
      label: Affected app
      options:
        - Mac app (sender)
        - iPhone / iPad receiver
        - Android receiver
        - Mac Receiver
        - More than one / unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, build or commit
      placeholder: "For example: 2.0.0 (build number), or a short commit SHA"
  - type: input
    id: sending-mac
    attributes:
      label: Sending Mac model and macOS version
      placeholder: "For example: MacBook Air M2, macOS 27"
  - type: input
    id: receiving-device
    attributes:
      label: Receiving device and OS version
      description: If the problem happens before connecting, state that.
      placeholder: "For example: Pixel 8, Android 16; or MacBook Pro, macOS 27"
  - type: dropdown
    id: route
    attributes:
      label: Connection
      options:
        - USB
        - Local Wi-Fi / Bonjour
        - Remote / private network (for example Tailscale)
        - Not connected / discovery / pairing
        - Not relevant / unsure
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display mode
      options:
        - Mirror
        - Extend
        - Window view (Mac windows)
        - More than one
        - Not applicable / unsure
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What is the user-visible impact? Include any error message (without sensitive details).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Start MeowDisplay on...
        2. Connect using...
        3. Open...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Sometimes
        - Once
        - Unknown
  - type: dropdown
    id: evidence
    attributes:
      label: How was this verified?
      options:
        - Physical device(s)
        - Simulator / emulator
        - Automated tests
        - Not reproduced yet
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Sanitized logs, screenshots or additional context (optional)
      description: Describe the evidence, or attach it only if you have checked it for private information.
