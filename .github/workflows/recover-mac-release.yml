name: Recover Mac release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to recover (pinned to 2.1.0)
        required: true
        type: string
        default: '2.1.0'
      candidate_sha:
        description: Candidate commit SHA (pinned)
        required: true
        type: string
        default: '94c796fc34fd699776764d67d2f26013909a308e'
      draft_id:
        description: Draft release ID (pinned to 442117184)
        required: true
        type: string
        default: '442117184'
      action:
        description: 'verify (read-only preflight) | publish (protected: verify draft, publish, reconcile) | reconcile (protected: release already public, record it) | finish (protected: website live, finish publication)'
        required: true
        type: choice
        options:
          - verify
          - publish
          - reconcile
          - finish
        default: verify
      promotion_pr:
        description: 'finish only: number of the release/2.1.0 -> main promotion PR (optional)'
        required: false
        type: string
        default: ''
      live_release_sha256:
        description: 'finish only, needed when Cloudflare challenges the runner: sha256 of https://meowdisplay.app/release.json as YOU fetched it'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: recover-mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      # Read-only GITHUB_TOKEN cannot inspect an unpublished GitHub Release.
      # Do not grant an unprotected job write access. The protected publish job
      # runs recover-mac-release.sh --publish, which verifies every draft asset,
      # notarization and Sparkle signature BEFORE editing the release.
      # The repository is public: the script's git fetches of release/2.1.0
      # and release-state need no credential, so none is persisted.
      - name: Preflight frozen candidate and release-state (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          set -euo pipefail
          scripts/release/reconcile-mac-release.sh --preflight

  # One protected job for every mutating action. publish is the only action
  # that edits the GitHub Release; reconcile and finish refuse to write
  # anything unless the release is already public, Latest, tagged at the
  # candidate and carrying exactly the recorded assets. After a run whose
  # release went public but whose reconciliation failed, re-run with
  # action=reconcile, never publish (publish refuses a non-draft release).
  publish:
    needs: verify
    if: ${{ inputs.action == 'publish' || inputs.action == 'reconcile' || inputs.action == 'finish' }}
    runs-on: xcode-27
    environment: release-publish
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Deployment branch guard
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            "refs/heads/release/"*) ;;
            *) echo "::error::Publication must run on a release/* branch to satisfy release-publish deployment branch policy (got $REF)"; exit 1 ;;
          esac
      - name: Environment requires human approval
        id: check-env
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-environment.sh release-publish --require-reviewers
      - name: Release state token (release App, contents only)
        id: state-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify protected draft and publish Mac release as Latest
        if: ${{ inputs.action == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          set -euo pipefail
          scripts/release/recover-mac-release.sh --publish
      - name: Reconcile release state
        if: ${{ inputs.action == 'publish' || inputs.action == 'reconcile' }}
        env:
          RELEASE_STATE_TOKEN: ${{ steps.state-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          scripts/release/reconcile-mac-release.sh --execute
      - name: Finish publication (website serves release.json)
        if: ${{ inputs.action == 'finish' }}
        env:
          RELEASE_STATE_TOKEN: ${{ steps.state-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PROMOTION_PR: ${{ inputs.promotion_pr }}
          LIVE_RELEASE_SHA256: ${{ inputs.live_release_sha256 }}
        run: |
          set -euo pipefail
          scripts/release/reconcile-mac-release.sh --finish
