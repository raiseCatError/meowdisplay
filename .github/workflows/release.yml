name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize release runs on the same ref so two quick merges can't race two
# uploads. Never cancel an in-flight run — it may be mid-upload or notarizing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          release-type: simple

  # The iOS app is not built here: App Store candidates are uploaded ahead of
  # the public release by the manually dispatched app-store-candidate.yml
  # workflow, so the iOS build can clear App Review first. See RELEASE.md.

  build-mac:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: xcodegen generate

      - name: Set up SSH for match certs repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build notarized macOS app
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          export APP_MARKETING_VERSION="${TAG_NAME#v}"
          # Sparkle orders updates by CFBundleVersion, so the Mac build number
          # must grow with every release, including the first one (1.20.0),
          # which was built by hand. The marketing version does; this
          # workflow's run number restarts at 1 on the fork and would not.
          export APP_BUILD_NUMBER="$APP_MARKETING_VERSION"
          bundle exec fastlane mac build_release
          bundle exec fastlane mac build_receiver_release

      # Both Mac apps ship on every release: the sender (macOS 14+) and the
      # standalone receiver (macOS 12+, issue #241).
      - name: Upload macOS artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            build/export/MeowDisplay.dmg \
            build/export/MeowDisplayReceiver.dmg

      # --- Sparkle auto-update: generate + publish the appcasts (issue #52) ---
      # Builds appcast.xml (sender) and appcast-receiver.xml (receiver app)
      # from the just-released, notarized DMGs and uploads them to the same
      # GitHub Release. One feed per app: each bundle has its own SUFeedURL,
      # and a mixed feed would offer the wrong app's update.
      #
      # The apps' SUFeedURLs (https://meowdisplay.app/appcast.xml and
      # /appcast-receiver.xml) redirect on Cloudflare to
      # releases/latest/download/<feed>, so the feed goes live together with
      # the release and needs no website deploy. See RELEASE.md.
      #
      # The apps require signed feeds (SURequireSignedFeed), which
      # generate_appcast produces when it finds that key in the archived app.
      # Required: without SPARKLE_PRIVATE_KEY no feed can be signed, and
      # installed apps would never be offered this release.
      - name: Publish Sparkle appcasts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          # Only this step sees the signing key.
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # Sparkle release that ships the generate_appcast / sign_update
          # tools, and the SHA-256 GitHub publishes for its tarball.
          SPARKLE_TOOLS_VERSION: "2.10.0"
          SPARKLE_TOOLS_SHA256: "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"
        run: |
          set -euo pipefail

          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set; cannot sign the appcasts"
            exit 1
          fi

          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          echo "${SPARKLE_TOOLS_SHA256}  /tmp/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          SPARKLE_BIN=/tmp/sparkle/bin

          # generate_appcast wants a directory of update archives per feed.
          # Download links point at this release's immutable per-tag assets.
          mkdir -p /tmp/appcast-updates /tmp/appcast-receiver-updates
          cp build/export/MeowDisplay.dmg /tmp/appcast-updates/
          cp build/export/MeowDisplayReceiver.dmg /tmp/appcast-receiver-updates/

          # The key goes in on stdin (`--ed-key-file -`), never to disk.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
            --link "https://meowdisplay.app/" \
            -o /tmp/appcast-updates/appcast.xml \
            /tmp/appcast-updates
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
            --link "https://meowdisplay.app/" \
            -o /tmp/appcast-receiver-updates/appcast-receiver.xml \
            /tmp/appcast-receiver-updates

          # The apps reject an unsigned feed or update, so check both
          # signatures with Sparkle's own verifier before publishing.
          for feed in /tmp/appcast-updates/appcast.xml /tmp/appcast-receiver-updates/appcast-receiver.xml; do
            grep -q 'sparkle:edSignature=' "$feed"
            printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/sign_update" --ed-key-file - --verify "$feed"
          done

          gh release upload "$TAG_NAME" --clobber \
            /tmp/appcast-updates/appcast.xml \
            /tmp/appcast-receiver-updates/appcast-receiver.xml
