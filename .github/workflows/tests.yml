name: Tests

# Nothing checked pull requests before this, so a branch that did not compile
# (or a test target that could not build) only surfaced on someone's laptop.
# Required checks (.github/rulesets): `mac`, `conventional` (pr-title.yml)
# and `release-tooling`; `android` once the Android app is on the branch.
on:
  pull_request:
  push:
    branches: [main, dev, 'release/**']

permissions:
  contents: read

# A superseded run tells us nothing, so drop in-flight runs for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify PR files using the synthetic merge commit's first parent (the base
  # branch). Keep the test jobs present, since the dev/main rulesets require
  # their exact check names; a skipped job reports success for branch protection.
  # A push to dev that adds exactly one commit (a PR's merge or squash commit)
  # is classified the same way against that commit's parent, so merging a
  # docs-only PR doesn't rebuild the apps; every other push (main, release/**,
  # several commits, a force-push) runs full CI. PRs that only change documentation, press-kit
  # media or press-kit tooling skip the Mac, iPhone Duo, Android and
  # release-tooling jobs (press-kit changes get the cheap press-kit job); a
  # pr-title.yml-only PR runs release-tooling but skips app builds. Everything
  # else runs full CI: mixed PRs, unknown paths and any workflow, script or
  # classifier change. The rules and their tests are scripts/ci/classify_pr_paths.py
  # and test_classify_pr_paths.py; the base branch's copy decides, so a PR can't
  # reclassify itself. Fail closed: the jobs below also run whenever this job
  # didn't succeed, so a broken classifier never turns into skipped (= passing) checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_media_only: ${{ steps.classify.outputs.docs_media_only }}
      workflow_only: ${{ steps.classify.outputs.workflow_only }}
      press_kit: ${{ steps.classify.outputs.press_kit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the pull request's files
        id: classify
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          full_ci() {
            {
              echo "docs_media_only=false"
              echo "workflow_only=false"
              echo "press_kit=true"
            } >> "$GITHUB_OUTPUT"
            echo "Full CI: $1"
          }
          # If the PR merge ref/parent isn't available, run all tests.
          if ! git rev-parse 'HEAD^1' >/dev/null 2>&1; then
            full_ci "no base commit"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/dev" ]]; then
            # Only when the push added exactly HEAD on top of what dev was.
            if [[ "$PUSH_BEFORE" != "$(git rev-parse 'HEAD^1')" ]]; then
              full_ci "the push to dev is not a single commit on its previous head"
              exit 0
            fi
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            full_ci "not a pull request or a single-commit push to dev"
            exit 0
          fi
          # The base branch's classifier (dev's before the push), never the change's own copy.
          classifier="$RUNNER_TEMP/classify_pr_paths.py"
          if ! git show 'HEAD^1:scripts/ci/classify_pr_paths.py' > "$classifier" 2>/dev/null; then
            full_ci "the base branch has no classifier"
            exit 0
          fi
          # --no-renames lists both sides of a rename, so code can't leave as a doc.
          git diff --no-renames --name-only -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-pr-paths"
          git diff --no-renames -U0 'HEAD^1' HEAD -- .gitignore > "$RUNNER_TEMP/gitignore.diff"
          python3 -I "$classifier" "$RUNNER_TEMP/changed-pr-paths" "$RUNNER_TEMP/gitignore.diff" "$GITHUB_OUTPUT"

  # Fast and first: the release and repository workflows stay fail-closed,
  # and the release library behaves (scripts/release/test).
  release-tooling:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_media_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.3'
      - name: Workflows stay fail-closed
        run: ruby scripts/release/check-release-workflows.rb
      - name: Release library, CLI, state branch and reference sync
        run: ruby -Iscripts/release/lib -e 'Dir["scripts/release/test/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
      - name: Pull request classifier
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Shell scripts
        run: |
          set -euo pipefail
          git ls-files -z 'scripts/release/*.sh' 'scripts/reference/*.sh' 'scripts/ci/*.sh' | xargs -0 -n1 bash -n
          git ls-files -z 'scripts/release/*.sh' 'scripts/reference/*.sh' 'scripts/ci/*.sh' | xargs -0 shellcheck -S warning

  # Press-kit media and tooling: build.py verifies every file against the
  # reviewed hashes in tools/press-kit/approved-assets.json and rebuilds the
  # page, previews and ZIPs; README and preview images must decode. Not a
  # required check; runs for press-kit changes, unclassified pushes and whenever classification failed.
  press-kit:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.press_kit == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Pillow
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pillow==12.3.0'
      - name: Build and verify the press kit
        if: hashFiles('tools/press-kit/build.py') != ''
        run: '"$RUNNER_TEMP/venv/bin/python" tools/press-kit/build.py'
      - name: Images decode
        run: |
          set -euo pipefail
          git ls-files -z assets/press-kit-preview.png 'assets/readme/*.png' 'assets/readme/*.jpg' 'assets/readme/*.jpeg' 'assets/readme/*.webp' 'assets/readme/*.gif' \
            | xargs -0 -r "$RUNNER_TEMP/venv/bin/python" -c '
          import sys
          from PIL import Image
          for path in sys.argv[1:]:
              with Image.open(path) as image:
                  image.load()
          print(f"{len(sys.argv) - 1} images decode")'

  # Runs on every branch; does real work only where the Android app exists.
  android:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.docs_media_only != 'true' && needs.changes.outputs.workflow_only != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: hashFiles('AndroidReceiver/settings.gradle.kts') != ''
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Tests, lint and an unsigned release bundle
        if: hashFiles('AndroidReceiver/settings.gradle.kts') != ''
        working-directory: AndroidReceiver
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintRelease :app:bundleRelease
      # The counts, so a review can see the suites really ran (Gradle prints none by itself).
      - name: Test counts
        if: always() && hashFiles('AndroidReceiver/settings.gradle.kts') != ''
        working-directory: AndroidReceiver
        run: |
          ruby -rrexml/document -e '
            totals = Hash.new { |h, k| h[k] = [0, 0, 0, 0] }
            Dir["*/build/test-results/**/TEST-*.xml"].each do |f|
              s = REXML::Document.new(File.read(f)).root
              t = totals[f.split("/").first]
              %w[tests failures errors skipped].each_with_index { |a, i| t[i] += s.attributes[a].to_i }
            end
            abort "no test results found" if totals.empty?
            totals.each { |m, (n, f, e, s)| puts "#{m}: #{n} tests, #{f} failures, #{e} errors, #{s} skipped" }'

  mac:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.docs_media_only != 'true' && needs.changes.outputs.workflow_only != 'true')) }}
    runs-on: xcode-27
    # A hung test must fail the job, not hold a runner for GitHub's six-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version

      # Deliberately without DEVELOPMENT_TEAM: nothing built here is
      # distributed, so an unsigned build is enough, and needing no secrets
      # means this check also runs on pull requests from forks.
      - name: Generate project
        run: xcodegen generate

      # Builds the Mac app as well as the test bundle, since the scheme covers
      # both — so this is a compile check for the app on top of the tests.
      # TLS, pinning and QUIC tests fail here instead of skipping when their setup (a
      # temporary keychain, a loopback QUIC listener) can't run, so they can't pass by not
      # running. xcodebuild hands TEST_RUNNER_* variables to the tests without the prefix.
      - name: Run macOS tests
        env:
          TEST_RUNNER_MEOW_REQUIRE_SECURITY_TESTS: "1"
        run: |
          # Per-test time limits: a test that hangs fails by name instead of stalling the job.
          xcodebuild test \
            -project MeowDisplay.xcodeproj \
            -scheme OpenSidecarMac \
            -destination 'platform=macOS' \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # The receiver app has a much lower deployment target than the sender
      # (issue #241); building it is what catches an API that only exists on
      # newer macOS sneaking into Shared/ or the receiver.
      - name: Build macOS receiver app
        run: |
          xcodebuild build \
            -project MeowDisplay.xcodeproj \
            -scheme OpenSidecarMacReceiver \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # The iPhone/iPad receiver shares Shared/ with both Mac apps but was
      # never compiled here, so an iOS-only break (or an API that exists only
      # on macOS) could reach main unnoticed. A generic-device build needs no
      # simulator runtime and no signing.
      - name: Build iOS receiver app
        run: |
          xcodebuild build \
            -project MeowDisplay.xcodeproj \
            -scheme OpenSidecariOS \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-receiver" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # `GeometryProxy.reservedRegions` (iPhone Duo fold/camera geometry)
      # exists only in the iOS 27.1+ SDK, so the receiver compiles it in
      # behind a compile-time gate. Prove which side of that gate this
      # toolchain took: the built app must reference the symbol exactly when
      # the SDK declares it — excluded on older SDKs, enabled on 27.1+.
      - name: Check reserved-region SDK gate
        run: |
          xcodebuild -version
          xcrun swiftc --version
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          app="$RUNNER_TEMP/ios-receiver/Build/Products/Debug-iphoneos/OpenSidecariOS.app"
          interfaces=("$sdk"/System/Library/Frameworks/SwiftUICore.framework/Modules/SwiftUICore.swiftmodule/*.swiftinterface)
          # A wrong path must fail here, never pass as "not referenced".
          test -d "$app"
          test -f "${interfaces[0]}"
          if grep -q 'func reservedRegions(' "${interfaces[@]}"; then
            declared=yes
          else
            declared=no
          fi
          if find "$app" -maxdepth 1 -type f \( -perm -u+x -o -name '*.dylib' \) -exec xcrun nm -u {} + 2>/dev/null \
              | grep -q 'GeometryProxyV15reservedRegions'; then
            referenced=yes
          else
            referenced=no
          fi
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version): reservedRegions declared=$declared referenced=$referenced"
          test "$declared" = "$referenced"

  # iPhone Duo: the receiver's UI tests on the Duo simulator, so adaptive layouts (the
  # window-sized Extend panel, size-class controls, safe areas) run on the form factor they
  # were made for. Not a required check yet: the first runs establish it.
  ios-duo:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.docs_media_only != 'true' && needs.changes.outputs.workflow_only != 'true')) }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Boot an iPhone Duo simulator
        id: duo
        run: echo "udid=$(scripts/ci/duo-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: UI tests on iPhone Duo
        run: |
          xcodebuild test \
            -project MeowDisplay.xcodeproj \
            -scheme OpenSidecariOS \
            -destination "id=${{ steps.duo.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/ios-duo" \
            -only-testing:OpenSidecariOSUITests/DemoModeSmokeTests \
            -only-testing:OpenSidecariOSUITests/AdaptiveLayoutTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
