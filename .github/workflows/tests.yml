name: Overview screenshot verification

on: workflow_dispatch

permissions:
  contents: read

jobs:
  overview-screenshots:
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            source: 09a56c5137a48c8b620fb993fe269b38a24bd8ab
          - label: after
            source: aa1488133f63ebbd751852c3cdab81872e10c60c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot Duo simulator
        id: simulator
        run: |
          udid=$(scripts/ci/duo-simulator.sh)
          scripts/ci/duo-simulator.sh boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build the simulator receiver
        run: |
          xcodebuild build-for-testing -project MeowDisplay.xcodeproj -scheme OpenSidecariOS \
            -destination "id=${{ steps.simulator.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/overview" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
      - name: Test and capture the Overview
        run: |
          xcodebuild test-without-building -project MeowDisplay.xcodeproj -scheme OpenSidecariOS \
            -destination "id=${{ steps.simulator.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/overview" \
            -resultBundlePath "$RUNNER_TEMP/Overview.xcresult" \
            -only-testing:OpenSidecariOSUITests/AdaptiveLayoutTests/testOverviewChromeKeepsOneLineWithoutAFold \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180
      - name: Export simulator screenshot attachments
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Overview.xcresult" \
            --output-path "$RUNNER_TEMP/overview-screenshots"
          git rev-parse HEAD > "$RUNNER_TEMP/overview-screenshots/source.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overview-${{ matrix.label }}
          path: ${{ runner.temp }}/overview-screenshots/
          retention-days: 3
