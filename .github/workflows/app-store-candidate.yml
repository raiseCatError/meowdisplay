name: iOS App Store candidate

# Manually dispatched iOS upload, decoupled from the public GitHub release so
# the iOS build can clear App Review before the Mac release goes live. See
# RELEASE.md: dispatch this against the open release-please PR branch with the
# version that PR will tag, then merge the PR once Apple has approved the build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, without the leading v (e.g. 1.20.0)"
        required: true
        type: string
      destination:
        description: "app-store uploads a release candidate (no review submission); testflight uploads a beta"
        required: true
        default: app-store
        type: choice
        options:
          - app-store
          - testflight

permissions:
  contents: read

# Never cancel an in-flight run — it may be mid-upload to App Store Connect.
concurrency:
  group: ios-upload
  cancel-in-progress: false

jobs:
  upload-ios:
    runs-on: macos-26
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 1.20.0 (got '$VERSION')" >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: xcodegen generate

      - name: Set up SSH for match certs repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build iOS app and upload to App Store Connect
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_MARKETING_VERSION: ${{ inputs.version }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          if [ "$DESTINATION" = "testflight" ]; then
            bundle exec fastlane ios beta
          else
            bundle exec fastlane ios release
          fi
