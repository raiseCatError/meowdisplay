name: CI experiment (never merged)

# Measurement only: the mac job's macOS tests, serial (as today) and with parallel test
# processes, same commit, same runner type. Eight parallel reps after the stop fix.
on:
  push:
    branches: ['ci-exp/**']

permissions:
  contents: read

jobs:
  mac-tests:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
        workers: [parallel-3]
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build the macOS tests
        run: |
          xcodebuild build-for-testing -project MeowDisplay.xcodeproj -scheme OpenSidecarMac -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/mac" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Run the macOS tests
        env:
          TEST_RUNNER_MEOW_REQUIRE_SECURITY_TESTS: "1"
        run: |
          if [ "${{ matrix.workers }}" = serial ]; then par=(-parallel-testing-enabled NO); else par=(-parallel-testing-enabled YES -parallel-testing-worker-count 3); fi
          xcodebuild test-without-building -project MeowDisplay.xcodeproj -scheme OpenSidecarMac -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/mac" "${par[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 600 \
            2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          grep -E "Executed [0-9]+ tests|with [0-9]+ failures" "$RUNNER_TEMP/test.log" | tail -3
          echo "test cases passed: $(grep -c "' passed (" "$RUNNER_TEMP/test.log"), failed: $(grep -c "' failed (" "$RUNNER_TEMP/test.log"), skipped: $(grep -c "' skipped (" "$RUNNER_TEMP/test.log")"
          xcrun xcresulttool get test-results summary --path "$(ls -d "$RUNNER_TEMP"/mac/Logs/Test/*.xcresult | head -1)" --compact \
            | jq -c '{result, totalTestCount, passedTests, failedTests, skippedTests, expectedFailures}' || true
          exit $status
