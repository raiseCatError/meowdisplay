name: Diagnose meowdisplay.app 403 (temporary, do not merge)

# Read-only: no secrets, no checkout. Which ways can a runner read the
# public website repository's HEAD, check runs and files?
on:
  pull_request:
    paths: ['.github/workflows/diag-cloudflare-403.yml']

permissions: {}

jobs:
  site-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Probe website repository access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          S=raiseCatError/MeowDisplayWebsite
          echo "## gh api with GITHUB_TOKEN"
          gh api "repos/$S/commits/main" --jq .sha || echo "-> failed"
          gh api "repos/$S/commits/main/check-runs?app_id=85455" --jq '.total_count' || echo "-> failed"
          echo "## unauthenticated REST"
          curl -sS -o /dev/null -w 'commits %{http_code}\n' "https://api.github.com/repos/$S/commits/main"
          curl -sS -w '\n' "https://api.github.com/repos/$S/commits/main/check-runs?app_id=85455&check_name=Cloudflare%20Pages&filter=latest" | jq -c '[.check_runs[]? | {app: .app.id, conclusion, head_sha}], .message' || true
          curl -sSI https://api.github.com/rate_limit | grep -i '^x-ratelimit-\(limit\|remaining\)'
          echo "## git and raw"
          git ls-remote "https://github.com/$S" refs/heads/main
          curl -sS -o /dev/null -w 'raw %{http_code}\n' "https://raw.githubusercontent.com/$S/main/release.json"
