name: Release candidate (Mac)

# Both Mac apps of one release candidate, from the exact commit
# release-candidate.yml was started for: build and Developer ID-sign,
# notarize, package as DMGs, verify against the PUBLISHED v1.20.0 baseline,
# sign both Sparkle feeds and verify them against the published key. It
# touches no release, tag or asset: the verified DMGs and feeds are kept as
# workflow artifacts (30 days, long enough to wait for App Review) for
# release-publish.yml, which is the only workflow that publishes.
#
# Stages, one job each: key-continuity (Sparkle key vs the PUBLISHED baseline
# apps) -> sign -> notarize -> package -> verify-artifacts (no secrets) ->
# sign-feeds -> verify-feeds (no secrets) -> record. Signing secrets live only
# in the release-build environment. Guards: scripts/release/check-release-workflows.rb.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions: {}

env:
  # Sparkle release that ships generate_appcast / sign_update (the tools used
  # for v1.20.0), and the SHA-256 GitHub publishes for its tarball.
  SPARKLE_TOOLS_VERSION: "2.10.0"
  SPARKLE_TOOLS_SHA256: "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"

jobs:
  key-continuity:
    runs-on: macos-26
    environment: release-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-environment.sh release-build
      - name: Build number is above the live feeds
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . scripts/release/baseline.env
          # The Mac build number is the marketing version (Sparkle compares
          # CFBundleVersion); it must be above every build the live feeds offer.
          scripts/release/check-build-number.sh "$VERSION" "$LIVE_FEED_BASE/$SENDER_FEED"
          scripts/release/check-build-number.sh "$VERSION" "$LIVE_FEED_BASE/$RECEIVER_FEED"
      - name: Published baseline apps (pinned v1.20.0 DMGs)
        run: scripts/release/published-baseline.sh "$RUNNER_TEMP/baseline"
      - name: Sparkle tools (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          echo "${SPARKLE_TOOLS_SHA256}  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
      - name: Sparkle key continuity (secret == project.yml == published apps)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY is not set"; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" | scripts/release/check-sparkle-key.sh "$RUNNER_TEMP/sparkle/bin" "$RUNNER_TEMP/baseline"

  sign:
    needs: key-continuity
    runs-on: macos-26
    environment: release-build
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { app: sender, name: "MeowDisplay" }
          - { app: receiver, name: "MeowDisplay Receiver" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-environment.sh release-build
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Generate project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: brew install xcodegen && xcodegen generate
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - name: Build and Developer ID-sign (no notarization)
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ inputs.version }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          # Sparkle orders updates by CFBundleVersion: the Mac build number is
          # the marketing version (1.20.0 shipped as build 1; key-continuity
          # checked this one is above every live feed's).
          APP_MARKETING_VERSION="$VERSION" APP_BUILD_NUMBER="$VERSION" bundle exec fastlane mac sign_app "app:$APP"
      - name: Pack the signed app
        env:
          NAME: ${{ matrix.name }}
        run: mkdir -p build/upload && ditto -c -k --sequesterRsrc --keepParent "build/export/$NAME.app" build/upload/app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.app }}
          path: build/upload/app.zip
          retention-days: 3
          if-no-files-found: error

  notarize:
    needs: sign
    runs-on: macos-26
    environment: release-build
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { app: sender, name: "MeowDisplay" }
          - { app: receiver, name: "MeowDisplay Receiver" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-environment.sh release-build
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ matrix.app }}
          path: build/upload
      - name: Notarize and staple
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ matrix.name }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p build/export && ditto -x -k build/upload/app.zip build/export
          bundle exec fastlane mac notarize_app "app:$APP"
          xcrun stapler validate "build/export/$NAME.app"
          rm build/upload/app.zip
          ditto -c -k --sequesterRsrc --keepParent "build/export/$NAME.app" build/upload/app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-${{ matrix.app }}
          path: build/upload/app.zip
          retention-days: 3
          if-no-files-found: error

  package:
    needs: notarize
    runs-on: macos-26
    environment: release-build
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { app: sender, name: "MeowDisplay", dmg: MeowDisplay.dmg }
          - { app: receiver, name: "MeowDisplay Receiver", dmg: MeowDisplayReceiver.dmg }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-environment.sh release-build
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarized-${{ matrix.app }}
          path: build/upload
      - name: Package a signed, notarized DMG
        env:
          APP: ${{ matrix.app }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p build/export && ditto -x -k build/upload/app.zip build/export
          bundle exec fastlane mac package_dmg "app:$APP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-${{ matrix.app }}
          path: build/export/${{ matrix.dmg }}
          retention-days: 30
          if-no-files-found: error

  verify-artifacts:
    needs: package
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      sender_sha256: ${{ steps.verify.outputs.sender_sha256 }}
      receiver_sha256: ${{ steps.verify.outputs.receiver_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - name: Verify both DMGs against the published baseline
        id: verify
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . scripts/release/baseline.env
          scripts/release/published-baseline.sh "$RUNNER_TEMP/baseline"
          scripts/release/verify-mac-artifact.sh "dist/$SENDER_DMG" sender "$VERSION" "$VERSION" "$RUNNER_TEMP/baseline"
          scripts/release/verify-mac-artifact.sh "dist/$RECEIVER_DMG" receiver "$VERSION" "$VERSION" "$RUNNER_TEMP/baseline"
          echo "sender_sha256=$(shasum -a 256 "dist/$SENDER_DMG" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "receiver_sha256=$(shasum -a 256 "dist/$RECEIVER_DMG" | cut -c1-64)" >> "$GITHUB_OUTPUT"

  sign-feeds:
    needs: verify-artifacts
    runs-on: macos-26
    environment: release-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - name: Environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-environment.sh release-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - name: Sign both feeds for the verified DMGs
        env:
          VERSION: ${{ inputs.version }}
          SENDER_SHA256: ${{ needs.verify-artifacts.outputs.sender_sha256 }}
          RECEIVER_SHA256: ${{ needs.verify-artifacts.outputs.receiver_sha256 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          . scripts/release/baseline.env
          printf '%s  %s\n' "$SENDER_SHA256" "dist/$SENDER_DMG" "$RECEIVER_SHA256" "dist/$RECEIVER_DMG" | shasum -a 256 -c -
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          echo "${SPARKLE_TOOLS_SHA256}  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          mkdir -p feeds
          for role in sender receiver; do
            select_app "$role"
            src="$RUNNER_TEMP/feed-$role"; mkdir -p "$src"; cp "dist/$DMG" "$src/"
            # Download links point at this release's per-tag assets; the key
            # goes in on stdin (`--ed-key-file -`), never to disk.
            printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - \
              --maximum-deltas 0 --link "$LIVE_FEED_BASE/" \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
              -o "$src/$FEED" "$src"
            cp "$src/$FEED" feeds/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feeds
          path: feeds/
          retention-days: 30
          if-no-files-found: error

  verify-feeds:
    needs: [verify-artifacts, sign-feeds]
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Select Xcode (.xcode-version)
        run: scripts/ci/select-xcode.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feeds
          path: dist
      - name: Verify both feeds against the PUBLISHED key
        env:
          VERSION: ${{ inputs.version }}
          SENDER_SHA256: ${{ needs.verify-artifacts.outputs.sender_sha256 }}
          RECEIVER_SHA256: ${{ needs.verify-artifacts.outputs.receiver_sha256 }}
        run: |
          set -euo pipefail
          . scripts/release/baseline.env
          printf '%s  %s\n' "$SENDER_SHA256" "dist/$SENDER_DMG" "$RECEIVER_SHA256" "dist/$RECEIVER_DMG" | shasum -a 256 -c -
          scripts/release/published-baseline.sh "$RUNNER_TEMP/baseline"
          for role in sender receiver; do
            select_app "$role"
            scripts/release/verify-feed.sh "dist/$FEED" "dist/$DMG" "$(cat "$RUNNER_TEMP/baseline/$role.key")" "$VERSION" "$VERSION" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$DMG"
          done

  # The verified DMGs and feeds, with their SHA-256s and this run's id (the
  # publish workflow downloads exactly these), become the Mac record of the
  # candidate: approved (ready), since the Mac has no store review.
  record:
    needs: verify-feeds
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.verify-feeds.result == 'success'
        with:
          pattern: '{dmg-*,feeds}'
          path: dist
          merge-multiple: true
      - name: Record the Mac candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          RESULT: ${{ needs.verify-feeds.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          state() { scripts/release/release-state.sh "$VERSION" "$@"; }
          if [ "$RESULT" != success ]; then
            state record STATE --platform mac --stage failed --sha "$SHA" --set "blockers=Mac pipeline $RESULT (run $RUN_ID)"
            exit 1
          fi
          artifacts=()
          for f in dist/*.dmg dist/*.xml; do artifacts+=(--artifact "$f"); done
          for stage in signed uploaded approved; do
            state record STATE --platform mac --stage "$stage" --sha "$SHA" --set "build=$VERSION" --set "runId=$RUN_ID" "${artifacts[@]}"
          done
