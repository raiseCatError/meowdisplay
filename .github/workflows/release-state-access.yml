name: Release state access check

# Proves the release-state authorization model without a release candidate:
#  - the release App's installation reaches this repository only;
#  - the job's GITHUB_TOKEN (contents: write) is refused by the release-state ruleset;
#  - the App's contents-only token is accepted.
# Its only write is dry-run.json at the release-state branch root (meow-release reads
# only releases/<version>.json). It builds, signs, uploads, tags and publishes nothing,
# and needs no release/<version> branch (pushing one starts a real candidate).
# Manual only, from the default branch (its environment allows main only).
on:
  workflow_dispatch:

permissions: {}

jobs:
  release-state-access:
    runs-on: ubuntu-latest
    environment: release-state-check
    permissions:
      contents: write
    steps:
      - name: Only from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this from $DEFAULT_BRANCH (got $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-environment.sh release-state-check --branches main
      - name: Missing secrets and variables
        env:
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
        run: scripts/release/report-missing.sh --fail RELEASE_APP_PRIVATE_KEY RELEASE_APP_CLIENT_ID
      - name: Release state token (release App, contents only)
        id: state-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Not restricted to this repository (owner, no repositories), metadata only: lists
      # every repository the installation can reach, which must be exactly this one.
      - name: Installation scope token (metadata only)
        id: scope-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
      - name: Only the release App writes release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE_TOKEN: ${{ steps.state-token.outputs.token }}
          INSTALLATION_SCOPE_TOKEN: ${{ steps.scope-token.outputs.token }}
        run: scripts/release/check-release-state-access.sh
