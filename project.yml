name: MeowDisplay
options:
  createIntermediateGroups: true
# Swift Package Manager dependencies. Sparkle is the macOS apps' out-of-store
# auto-update framework (issue #52): embedded open-source code + CLI tooling,
# not a hosted service. Feed URLs and the EdDSA public key are set on the Mac
# targets below.
packages:
  # Exact versions, so a clean checkout builds against the same libraries the
  # release candidate was tested with (the resolved file lives in the
  # generated, untracked project). Raise them deliberately, then re-test.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.9 is the first release that supports signed feeds
    # (SURequireSignedFeed below).
    exactVersion: "2.10.1"
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates
    exactVersion: "1.21.1"
  SwiftASN1:
    url: https://github.com/apple/swift-asn1
    exactVersion: "1.7.3"
  # Not linked directly: pins swift-certificates' own dependency.
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto
    exactVersion: "5.0.3"
schemes:
  OpenSidecarMac:
    build:
      targets:
        OpenSidecarMac: all
    test:
      targets:
        - OpenSidecarMacTests
  OpenSidecariOS:
    build:
      targets:
        OpenSidecariOS: all
    test:
      targets:
        - OpenSidecariOSUITests
  OpenSidecarMacReceiver:
    build:
      targets:
        OpenSidecarMacReceiver: all
# DEVELOPMENT_TEAM comes from the environment (see generate.sh / .env) so no
# personal team ID lives in the repo. Unset = unsigned, fine for CI.
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6"
    # Lets Xcode auto-extract new user-facing strings into each target's
    # Localizable.xcstrings on every build, so the String Catalog stays in
    # sync with the source without a manual export step.
    SWIFT_EMIT_LOC_STRINGS: YES
    # Version defaults for local builds. CI overrides both via xcargs:
    # MARKETING_VERSION from the release tag, CURRENT_PROJECT_VERSION from
    # the GitHub Actions run number (monotonic, keeps TestFlight builds unique).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenSidecarMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
      - Shared
      # The unified app's "Use This Mac as a Display" role: the Mac
      # Receiver's code, minus its own app entry point and bundle resources
      # (MeowDisplay keeps one icon, string catalog and Info.plist). The
      # standalone receiver target below still builds all of it for macOS
      # 12-13.
      - path: MacReceiver
        excludes:
          - OpenSidecarMacReceiverApp.swift
          - Info.plist
          - "*.entitlements"
          - "*.xcstrings"
          - Assets.xcassets
    dependencies:
      - package: Sparkle
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    info:
      path: Mac/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: MeowDisplay connects to your iPhone, iPad, Android device or other Mac over your Wi-Fi network.
        NSBonjourServices: ["_opensidecar._tcp", "_meowdisp-q._udp", "_opendisplay-pair._tcp", "_opendisplay-mac-pair._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # The receiver role keeps its own identity and pins (see
        # ReceiverRoleConfiguration / TrustStore.receiverRole).
        MeowDisplayReceiverRoleTrust: separate
        # --- Sparkle auto-update (see RELEASE.md) ---
        # MeowDisplay's own feed and EdDSA public key — never upstream
        # OpenDisplay's. Both Mac apps trust the same key; each has its own
        # feed so neither is offered the other app's update.
        # SUEnableAutomaticChecks is deliberately unset: Sparkle then asks the
        # user before turning on background checks.
        SUFeedURL: https://meowdisplay.app/appcast.xml
        SUPublicEDKey: M9Je3RXE9GYGv7ZvVmJj2xK2FrpSR/rQvbuZFfYORcU=
        # Check the EdDSA signature before extracting an update, and only
        # accept an appcast/release notes signed with that key (a compromised
        # feed host can't redirect users elsewhere). generate_appcast signs
        # the feed when it sees these keys in the archived app.
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.mac
        PRODUCT_NAME: MeowDisplay
        BUNDLE_DISPLAY_NAME: MeowDisplay
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac/OpenSidecarMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local dev builds get their own identity: TCC keys permission
        # grants by bundle ID + code signature, so a Debug build sharing
        # the release bundle ID knocks out the release app's Screen
        # Recording/Accessibility grants every time the binary changes.
        # PRODUCT_NAME (not BUNDLE_DISPLAY_NAME) is what the permission
        # lists show, so the Debug build must override it to appear as its
        # own row instead of a second, indistinguishable "MeowDisplay".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.mac.debug
          PRODUCT_NAME: MeowDisplay Dev
          BUNDLE_DISPLAY_NAME: MeowDisplay Dev
          # No debug-dylib stub: with it every Debug build's main executable is the same tiny
          # stub with one fixed UUID, and macOS Local Network privacy keys its grants by the
          # main executable's UUID (TN3179). A shared, unchanging UUID left the grant unmatched,
          # so outgoing connections to devices failed silently ("Local network prohibited").
          ENABLE_DEBUG_DYLIB: NO
          # Grayscale icon (same composition as Release) so the dev build is
          # obvious in the Dock, cmd-tab and permission lists.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  # The standalone receiver app (issues #82/#17/#241): a spare Mac as a
  # display. Deliberately its own bundle with a much lower deployment target
  # than the sender, which is pinned to 14 by its capture stack. Everything
  # under Shared/ and the files listed from Mac/ must therefore compile at
  # this floor; keep this the oldest macOS the receiver path supports.
  OpenSidecarMacReceiver:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - MacReceiver
      - Shared
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/CheckForUpdatesView.swift
      - Mac/NativeSearchField.swift
    dependencies:
      - package: Sparkle
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    info:
      path: MacReceiver/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: MeowDisplay Receiver advertises itself on the local network so another Mac can connect and use this Mac as a display.
        NSBonjourServices: ["_opensidecar._tcp", "_meowdisp-q._udp", "_opendisplay-pair._tcp", "_opendisplay-mac-pair._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # Sparkle: see the sender target's comment above. Own feed, same key.
        SUFeedURL: https://meowdisplay.app/appcast-receiver.xml
        SUPublicEDKey: M9Je3RXE9GYGv7ZvVmJj2xK2FrpSR/rQvbuZFfYORcU=
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.mac.receiver
        PRODUCT_NAME: MeowDisplay Receiver
        BUNDLE_DISPLAY_NAME: MeowDisplay Receiver
        # Log.swift's file locking helpers live in the C bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacReceiver/OpenSidecarMacReceiver.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.mac.receiver.debug
          PRODUCT_NAME: MeowDisplay Receiver Dev
          BUNDLE_DISPLAY_NAME: MeowDisplay Receiver Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  OpenSidecarMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacTests
      - Mac/DisplayArrangement.swift
      - Mac/CoalescingFetch.swift
      - Mac/MissionControlMonitor.swift
      - Shared/StagePeekDockLayout.swift
      - Mac/OriginRestore.swift
      - Mac/InputRouting.swift
      - Mac/SmartTouchTargetClassifier.swift
      - Mac/TextCaretFollower.swift
      - MacReceiver/ReceiverWindowLifecycle.swift
      - MacReceiver/ReceiverSettingsCategory.swift
      - MacReceiver/ReceiverInputForwarding.swift
      - MacReceiver/ReceiverOwnership.swift
      - Shared/ReceiverRoleConfiguration.swift
      - Mac/MacAppRole.swift
      - Mac/LoginSession.swift
      - Shared/ReceiverGesture.swift
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/CaptureLifecycle.swift
      - Mac/TransportSafety.swift
      - Mac/MacSenderPipelineState.swift
      - Mac/MacSenderStatusSink.swift
      - Mac/MacSenderVideoEncoder.swift
      - Mac/SenderTransport.swift
      - Mac/MacSenderTransportController.swift
      # QUIC transport (PROTOCOL.md §8): the controller and StreamReceiver
      # above reference these directly.
      - Mac/QUICTransportSession.swift
      - Mac/TransportProtocolSelection.swift
      - Mac/TailscaleDiscovery.swift
      - Mac/StartupHandoffPolicy.swift
