name: MeowDisplay
options:
  createIntermediateGroups: true
# Swift Package Manager dependencies. Sparkle powers the macOS app's
# out-of-store auto-update (issue #52); it's an embedded open-source
# framework + CLI tooling, not a hosted service — the appcast feed and the
# DMG are served from infrastructure we already own (GitHub Pages + Releases).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.x is the current major (latest 2.9.x) and the first Sparkle line to
    # support SPM. `from:` allows compatible 2.x updates.
    from: "2.6.0"
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates
    from: "1.19.1"
  SwiftASN1:
    url: https://github.com/apple/swift-asn1
    from: "1.1.0"
schemes:
  OpenSidecarMac:
    build:
      targets:
        OpenSidecarMac: all
    test:
      targets:
        - OpenSidecarMacTests
  OpenSidecariOS:
    build:
      targets:
        OpenSidecariOS: all
  OpenSidecarMacReceiver:
    build:
      targets:
        OpenSidecarMacReceiver: all
# DEVELOPMENT_TEAM comes from the environment (see generate.sh / .env) so no
# personal team ID lives in the repo. Unset = unsigned, fine for CI.
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    # Version defaults for local builds. CI overrides both via xcargs:
    # MARKETING_VERSION from the release tag, CURRENT_PROJECT_VERSION from
    # the GitHub Actions run number (monotonic, keeps TestFlight builds unique).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenSidecarMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
      - Shared
    dependencies:
      - package: Sparkle
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    info:
      path: Mac/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: MeowDisplay connects to your iPad or iPhone over the local network in WiFi mode.
        NSBonjourServices: ["_opensidecar._tcp", "_opendisplay-pair._tcp", "_opendisplay-mac-pair._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # --- Sparkle auto-update ---
        # Disabled: MeowDisplay does not yet have its own appcast + signing
        # infrastructure, and must not consume upstream OpenDisplay's feed or
        # trust its signing key. Re-add SUFeedURL + SUPublicEDKey (a fresh
        # MeowDisplay-owned key pair — never reuse upstream's) and flip this
        # back to true once MeowDisplay hosts its own appcast.
        SUEnableAutomaticChecks: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.mac
        PRODUCT_NAME: MeowDisplay
        BUNDLE_DISPLAY_NAME: MeowDisplay
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac/OpenSidecarMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local dev builds get their own identity: TCC keys permission
        # grants by bundle ID + code signature, so a Debug build sharing
        # the release bundle ID knocks out the release app's Screen
        # Recording/Accessibility grants every time the binary changes.
        # PRODUCT_NAME (not BUNDLE_DISPLAY_NAME) is what the permission
        # lists show, so the Debug build must override it to appear as its
        # own row instead of a second, indistinguishable "MeowDisplay".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.mac.debug
          PRODUCT_NAME: MeowDisplay Dev
          BUNDLE_DISPLAY_NAME: MeowDisplay Dev
          # Grayscale icon (same composition as Release) so the dev build is
          # obvious in the Dock, cmd-tab and permission lists.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  # The standalone receiver app (issues #82/#17/#241): a spare Mac as a
  # display. Deliberately its own bundle with a much lower deployment target
  # than the sender, which is pinned to 14 by its capture stack. Everything
  # under Shared/ and the files listed from Mac/ must therefore compile at
  # this floor; keep this the oldest macOS the receiver path supports.
  OpenSidecarMacReceiver:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - MacReceiver
      - Shared
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/CheckForUpdatesView.swift
    dependencies:
      - package: Sparkle
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    info:
      path: MacReceiver/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: MeowDisplay Receiver advertises itself on the local network so another Mac can connect and use this Mac as a display.
        NSBonjourServices: ["_opensidecar._tcp", "_opendisplay-pair._tcp", "_opendisplay-mac-pair._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # Disabled: see the sender target's Sparkle comment above — no
        # MeowDisplay-owned appcast/signing infrastructure exists yet.
        SUEnableAutomaticChecks: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.mac.receiver
        PRODUCT_NAME: MeowDisplay Receiver
        BUNDLE_DISPLAY_NAME: MeowDisplay Receiver
        # Log.swift's file locking helpers live in the C bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacReceiver/OpenSidecarMacReceiver.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.mac.receiver.debug
          PRODUCT_NAME: MeowDisplay Receiver Dev
          BUNDLE_DISPLAY_NAME: MeowDisplay Receiver Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  OpenSidecarMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacTests
      - Mac/DisplayArrangement.swift
      - Mac/InputRouting.swift
      - Shared/ReceiverGesture.swift
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/CaptureLifecycle.swift
      - Mac/TransportSafety.swift
      - Mac/AutoConnectPolicy.swift
      - Mac/ReconnectPolicy.swift
      - Mac/AuthenticatedSessionState.swift
      - Mac/CanonicalRuntimeStatus.swift
      - Mac/SettingsCategory.swift
      - Mac/ForgetDeviceAction.swift
      - Mac/ReceiverInputAuthorizationStore.swift
      - Mac/RouteOverrides.swift
      - Mac/WakeInspector.swift
      - Mac/AppPresentation.swift
      - Mac/StartAtLoginPolicy.swift
      - Mac/MirrorDisplaySelection.swift
      - Shared/WakeConnectAttempt.swift
      - Shared/ConnectionRoute.swift
      - Shared/RemoteEndpointStore.swift
      - Shared/RemoteEndpointValidation.swift
      - Shared/WakeOnLAN.swift
      - Shared/StreamListenerRestartState.swift
      - Shared/ReceiverSessionState.swift
      - Shared/DisplayState.swift
      - Shared/LogSnapshot.swift
      - Shared/Protocol.swift
      - Shared/AudioMediaFrame.swift
      - Shared/PCMPlaybackEngine.swift
      - Shared/RemoteViewport.swift
      - Shared/PointerGestureEngine.swift
      - Shared/ScrollMomentum.swift
      - Shared/KeyboardEditPlanner.swift
      - Shared/ControlProfile.swift
      - Shared/ControlInteraction.swift
      - Shared/ControlTrayGeometry.swift
      - Shared/Pairing.swift
      - Shared/PairingPromptModel.swift
    settings:
      base:
        # A hostless test bundle: the sources under test are compiled straight
        # into it, so there is no app to inject into and nothing to load from.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        # Without this the bundle has no Info.plist and code signing refuses to
        # run, which fails the build before a single test executes.
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
  OpenSidecariOS:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - iOS
      - Shared
    dependencies:
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: MeowDisplay
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: MeowDisplay advertises itself on the local network so your Mac can connect over WiFi.
        NSBonjourServices: ["_opensidecar._tcp", "_opendisplay-pair._tcp", "_opendisplay-mac-pair._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
