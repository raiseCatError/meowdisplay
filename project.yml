      # iOS Demo Mode boundary (Foundation only, no UIKit).
      - iOS/DemoSession.swift
      - iOS/DemoDesktop.swift
      - Shared/MobileSettingsSearch.swift
      - Shared/CustomLayoutSharing.swift
      - Shared/ReceiverInputPrompt.swift
      - Shared/Pairing.swift
      - Shared/PairingPromptModel.swift
      - Shared/RemotePairing.swift
      - Shared/PairingSession.swift
      - Shared/StreamingProfile.swift
      - Shared/StreamingPriority.swift
      - Shared/StreamingMode.swift
      - Shared/CatMode.swift
      - Shared/ExtendDisplayShape.swift
      - Shared/DecodeCeiling.swift
      - Shared/EncoderCapability.swift
      - Shared/CodecCapability.swift
      - Shared/ReceiverMaxFPS.swift
      - Shared/FrameRateLimiter.swift
    dependencies:
      # Receiver Swift6-B1: TrustStore.swift (added above for
      # ReceiverUISinkTests' real StreamReceiver) needs the same
      # certificate/ASN.1 packages `OpenSidecarMac` links.
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    settings:
      base:
        # A hostless test bundle: the sources under test are compiled straight
        # into it, so there is no app to inject into and nothing to load from.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        # Without this the bundle has no Info.plist and code signing refuses to
        # run, which fails the build before a single test executes.
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
  OpenSidecariOS:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - iOS
      - Shared
      # The App Store privacy manifest must land in Copy Bundle Resources.
      # Current XcodeGen already puts an unknown `.xcprivacy` there, but
      # 2.40.0 put it in no build phase at all, so say it explicitly (the
      # `iOS` entry above and this one resolve to a single build file).
      - path: iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SwiftCertificates
        product: X509
      - package: SwiftASN1
        product: SwiftASN1
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: MeowDisplay
        # Shown by some system UI (e.g. the menu bar when the iPad app runs on a Mac). Not an
        # identity: the bundle ID, executable (OpenSidecariOS), keychain and settings are unchanged.
        CFBundleName: MeowDisplay
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Opts the iPad out of Split View/Slide Over/Stage Manager resizing:
        # the receiver surface assumes it owns the whole screen (safe-area,
        # notch and tray geometry). Apple has deprecated this key; dropping it
        # means supporting arbitrary window sizes, which is its own change.
        # TODO: remove once the receiver surface handles resizable windows.
        UIRequiresFullScreen: true
        # Mouse and trackpad clicks arrive as pointer touches (hover, right click, scroll): HID-B.
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: MeowDisplay advertises itself on the local network so your Mac can connect over Wi-Fi.
        NSFaceIDUsageDescription: MeowDisplay asks for Face ID or your passcode to confirm that you want to trust a new device.
        # Save to Device: photos and videos from the Mac go to Photos (add only, never read).
        NSPhotoLibraryAddUsageDescription: MeowDisplay saves the photos and videos you copy from your Mac to your photo library.
        # Other saved files land in Files ▸ On My iPhone/iPad ▸ MeowDisplay ▸ Downloads.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Export compliance, as declared in App Store Connect: the app uses
        # only standard, exempt encryption (TLS and pairing through Apple's
        # frameworks), so no non-exempt encryption. It does not mean the app
        # has no cryptography. Revisit if the cryptography ever changes.
        ITSAppUsesNonExemptEncryption: false
        NSBonjourServices: ["_opensidecar._tcp", "_meowdisp-q._udp", "_opendisplay-pair._tcp", "_opendisplay-mac-pair._tcp"]
        # "Audio, AirPlay, and Picture in Picture": required for the receiver's
        # Picture in Picture window to keep showing the stream in the background.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Demo Mode smoke path for App Review (launch, Try the Demo, Settings, exit).
  OpenSidecariOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - iOSUITests
    dependencies:
      - target: OpenSidecariOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.raisecaterror.meowdisplay.ios.uitests
